[package]
name = "puredub-android"
version = "0.1.0"
edition = "2024"
license = "MIT"
publish = false

[lib]
name = "puredub_android"
crate-type = ["cdylib", "rlib"]

[dependencies]
puredub-core = { git = "https://github.com/bclark/puredub-core", rev = "8337b561c76106b3e1da3684da668140127cd0d3" }
release-metadata = { git = "https://github.com/bclark/release-metadata", rev = "0fb57628774cbfea148a965bb2b5f3c81b3296c5", features = ["musicbrainz"] }
serde_json = "1"
hound = "3.5"

[target.'cfg(target_os = "android")'.dependencies]
jni = "0.21"

[profile.release]
opt-level = 2
strip = "debuginfo"
