[package]
name = "puredub"
version = "0.1.0"
edition = "2024"
license = "MIT"
description = "Faithful tape capture. Tracks made simple."
repository = "https://github.com/bclark/puredub"

[dependencies]
eframe = { version = "0.33.3", default-features = false, features = ["default_fonts", "glow", "x11", "wayland", "accesskit"] }
puredub-core = { git = "https://github.com/bclark/puredub-core", rev = "8337b561c76106b3e1da3684da668140127cd0d3" }
release-metadata = { git = "https://github.com/bclark/release-metadata", rev = "0fb57628774cbfea148a965bb2b5f3c81b3296c5", features = ["musicbrainz"] }
rfd = "0.15"
rodio = { version = "0.20", default-features = false }
image = { version = "0.25", default-features = false, features = ["png"] }

[build-dependencies]
winresource = "0.1"

[profile.release]
opt-level = 2

