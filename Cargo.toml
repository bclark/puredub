[package]
name = "puredub"
version = "0.1.0"
edition = "2024"
license = "MIT"
description = "Faithful tape capture. Tracks made simple."
repository = "https://github.com/bclark/puredub"

[dependencies]
eframe = { version = "0.33.3", default-features = false, features = ["default_fonts", "glow", "x11", "wayland", "accesskit"] }
hound = "3.5"
rfd = "0.15"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
reqwest = { version = "0.12", default-features = false, features = ["blocking", "json", "rustls-tls"] }
rodio = { version = "0.20", default-features = false }
flacenc = "0.5.1"
lofty = "0.25.5"
image = { version = "0.25", default-features = false, features = ["png"] }
claxon = "0.4"

[build-dependencies]
winresource = "0.1"

[profile.release]
opt-level = 2

