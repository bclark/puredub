name: Build and test
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  desktop:
    strategy:
      matrix:
        os: [windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --check
      - run: cargo test --locked
      - run: cargo build --release --locked
      - name: Package Windows preview
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          New-Item -ItemType Directory dist/PureDub -Force | Out-Null
          Copy-Item target/release/puredub.exe,LICENSE,README.md dist/PureDub/
          Compress-Archive -Path dist/PureDub -DestinationPath dist/PureDub-windows.zip
      - name: Package unsigned macOS app
        if: runner.os == 'macOS'
        run: |
          mkdir -p dist/PureDub.app/Contents/MacOS dist/PureDub.app/Contents/Resources
          cp target/release/puredub dist/PureDub.app/Contents/MacOS/PureDub
          cp assets/puredub.icns dist/PureDub.app/Contents/Resources/
          cp packaging/Info.plist dist/PureDub.app/Contents/
          ditto -c -k --sequesterRsrc --keepParent dist/PureDub.app dist/PureDub-macos.zip
      - uses: actions/upload-artifact@v4
        with:
          name: puredub-${{ matrix.os }}
          path: |
            dist/*.zip
          if-no-files-found: error
